name: Link Check

on:
  schedule:
    # 每月 1 日 03:07 UTC 自动运行
    - cron: '7 3 1 * *'
  workflow_dispatch: {}

permissions:
  issues: write
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run verify.py
        id: verify
        continue-on-error: true
        run: python verify.py --csv verify_report.csv

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-report
          path: verify_report.csv
          if-no-files-found: ignore

      - name: Open issue on failure
        if: steps.verify.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const title = '⚠️ 制裁/出口管制清单链接失效';
            const existing = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: ['link-check']
            });
            if (existing.data.some(i => i.title === title)) {
              console.log('已有未关闭的失效 issue，跳过新建。');
              return;
            }
            await github.rest.issues.create({
              owner, repo,
              title,
              labels: ['link-check'],
              body: '`verify.py` 检测到部分数据源链接不可达，请核对 `download_url` 并刷新 `last_verified`。\n详见本次 Action 运行日志与上传的 `verify_report.csv` 产物。'
            });
